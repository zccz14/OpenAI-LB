name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/openai-lb package/
          cp README.md LICENSE package/
          tar -C package -czf openai-lb-${{ matrix.target }}.tar.gz .
          shasum -a 256 openai-lb-${{ matrix.target }}.tar.gz > openai-lb-${{ matrix.target }}.tar.gz.sha256
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory package
          Copy-Item target/${{ matrix.target }}/release/openai-lb.exe package/
          Copy-Item README.md,LICENSE package/
          Compress-Archive package/* openai-lb-${{ matrix.target }}.zip
          $hash = (Get-FileHash openai-lb-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          $checksum = "$hash  openai-lb-${{ matrix.target }}.zip`n"
          [System.IO.File]::WriteAllText("openai-lb-${{ matrix.target }}.zip.sha256", $checksum, [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: openai-lb-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
